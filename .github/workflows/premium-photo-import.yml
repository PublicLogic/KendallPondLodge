name: Verify approved property photo replacements
on:
  push:
    branches: [media/premium-rooms-grounds-20261028]
    paths: [.github/workflows/premium-photo-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply previously tested photo selections
        run: node .github/premium-photo-replacements.cjs
      - name: Verify property and booking regressions
        run: npm run test:core
      - name: Store verified changes on media branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY;
          const branch='media/premium-rooms-grounds-20261028';
          async function api(path,body){
            const r=await fetch('https://api.github.com/repos/'+repo+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+process.env.GH_TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
            if(!r.ok)throw Error('GitHub operation failed: '+r.status);
            return r.json();
          }
          const ref=await api('/git/ref/heads/'+branch);
          if(ref.object.sha!==process.env.GITHUB_SHA)throw Error('Branch changed; refusing to overwrite');
          const base=await api('/git/commits/'+ref.object.sha);
          const entries=[];
          for(const path of ['app/lodge/page.tsx','app/grounds/page.tsx','public/images/kpl/website-top-50/manifest.json','tests/curated-gallery.test.mjs']){
            const blob=await api('/git/blobs',{content:fs.readFileSync(path).toString('base64'),encoding:'base64'});
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha});
          }
          const tree=await api('/git/trees',{base_tree:base.tree.sha,tree:entries});
          const commit=await api('/git/commits',{message:'Replace weak room and grounds photography with five finished originals',tree:tree.sha,parents:[ref.object.sha]});
          const r=await fetch('https://api.github.com/repos/'+repo+'/git/refs/heads/'+branch,{method:'PATCH',headers:{'Authorization':'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github+json'},body:JSON.stringify({sha:commit.sha,force:false})});
          if(!r.ok)throw Error('Branch update failed: '+r.status);
          console.log('Verified replacements committed: '+commit.sha);
          JS
